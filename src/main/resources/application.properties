# Configurações da aplicação
spring.application.name=srv-team

# Configurações do servidor
server.port=8080

# Configurações do MySQL Database (produção)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/srv_team?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:srv_team}
spring.datasource.password=${DB_PASSWORD:srv_team}

# Console H2 desabilitado para MySQL
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Configurações do JPA/Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações de logging
logging.level.com.example.srvteam=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configurações JWT
jwt.secret=${JWT_SECRET:ChangeThisJwtSecretKeyToASecureValue32BytesLong}
jwt.expiration=86400000
