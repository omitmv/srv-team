name: Maven 4 Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  maven4-compatibility:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Maven 4 RC
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-4/4.0.0-rc-6/binaries/apache-maven-4.0.0-rc-6-bin.tar.gz \
            | tar -xz

      - name: Validate with Maven 4 RC
        run: |
          export DB_URL='jdbc:h2:mem:srvteam;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE'
          export DB_USERNAME='sa'
          export DB_PASSWORD=''
          export JWT_SECRET="$(python - <<'PY'
import secrets
print(secrets.token_urlsafe(48))
PY
)"
          ./apache-maven-4.0.0-rc-6/bin/mvn --batch-mode -DskipTests verify
