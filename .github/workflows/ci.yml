name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DB_URL: jdbc:h2:mem:ci;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
      DB_USERNAME: sa
      DB_PASSWORD: ""
      JWT_SECRET: ChangeThisJwtSecretKeyToASecureValue32BytesLongForCi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Maven verify
        run: ./mvnw -B verify
